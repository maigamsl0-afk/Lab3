<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog - Registration</title>
  <link rel="stylesheet" href="css/Stylesheet.css">
  <style>
    input[type="number"]{
      width: 100%; padding: 8px 10px; font-size: 1rem;
      border: 2px solid #64748b; border-radius: 8px;
      background: var(--surface); color: var(--text); box-sizing: border-box;
    }
    .field-error{ display: block; min-height: 1.2em; margin-top: 4px; font-size: 0.9rem; font-weight: bold; color: var(--error-text); }
    input.invalid{ border-color: #dc2626; }
  </style>
</head>
<body>
  <header>
    <h1>My Blog</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="components.html">Components</a>
      <a class="active" href="validation.html">Register</a>
      <a href="data.html">Data</a>
    </nav>
  </header>

  <main class="container">
    <h2>Registration Form</h2>
    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" autocomplete="off">
        <span class="field-error" id="name-error" role="alert"></span>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="off">
        <span class="field-error" id="email-error" role="alert"></span>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password">
        <span class="field-error" id="password-error" role="alert"></span>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm">
        <span class="field-error" id="confirm-error" role="alert"></span>
      </div>
      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age">
        <span class="field-error" id="age-error" role="alert"></span>
      </div>
      <button type="submit" class="btn">Register</button>
    </form>
    <div class="alert alert-success" id="success" role="status" hidden>Registration successful!</div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Blog</p>
  </footer>

  <script src="js/validation.js"></script>
</body>
</html>
